# The people of customer_attributes_coworker (docs/COWORKER_SPEC.md, section 5). The agent sits at `core`.
# One requirement differs between variants; the facts are the same in every variant.
default = "reassign"

[[person]]
name = "maya"
role = "requester"
about = "Maya, the product manager who asked for this feature. She knows what is wanted, not how the code works."

  [[person.topic]]
  id = "delete-type-with-customers"
  kind = "requirement"
  topic = "what should happen when staff delete a customer type that some customers still have (a type that is in use)"
  source = "saleor/saleor#19521: `reassign` is what the project built, and the thread did not debate it; `refuse` is authored"
  [person.topic.says]
  reassign = "When staff delete a customer type that customers still have, move those customers to the default type and then delete it. Don't refuse the deletion."
  refuse = "When staff try to delete a customer type that customers still have, refuse it and return an error. The type and its customers stay as they are; staff have to move the customers to another type first."

  [[person.topic]]
  id = "default-type"
  kind = "fact"
  topic = "which type a customer gets when none is chosen, and whether the default type itself can be deleted"
  says = "A customer created without a type gets the default type. The default type itself can't be deleted: someone has to make another type the default first."

  [[person.topic]]
  id = "who-manages"
  kind = "fact"
  topic = "which permission staff need to manage customer types and customer attributes"
  says = "Managing customer types and customer attributes takes the customer-type permission. The product and page permissions don't cover it."

  [[person.topic]]
  id = "translating-values"
  kind = "fact"
  topic = "whether the values of customer attributes can be translated"
  says = "No. Values of customer attributes can't be translated."
