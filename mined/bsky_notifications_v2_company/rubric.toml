# The rubric of bsky_notifications_v2_company: every criterion the work is judged by, what decides it, and why it is there.
# tools/harbor_company_score.py (in a task: /tests/score.py) runs it. Format and reward: see that file's header.
#
# gate    = must pass for anything to be scored.
# target  = what the work is to achieve. Scores 0 on the company as the work starts.
# guard   = what must keep working. Scores 1 on the company as the work starts.
# fit     = whether the two repositories fit each other as they would be deployed.
# measure = reported beside the reward, never part of it.
# reward  = 0 if a gate fails, else weighted mean of targets x product of guards x product of fits.
#           Targets: the AppView's hidden tests (weight 1), the app's hidden tests (0.5: upstream's unit tests of
#           its own query helpers), and a person reading grouped notifications in the app's web build (1).
#
# Every score is a share from 0 to 1, so work that is partly done is partly rewarded.

# ---------------------------------------------------------------- the gates

[[criterion]]
id = "appview-serves-and-app-calls-it"
kind = "gate"
type = "contract"
check = "works"
note = """Both repositories on `main` can be read for their contract: the AppView's source registers its methods
(`server.add(...)` under `packages/bsky/src/api`), the app's code calls lexicon methods, and both sides' lexicons
parse. Without this there is nothing the two sides could be held against each other with. That the AppView really
answers, built and started in the dev network, is the browser target's to judge."""

[[criterion]]
id = "pushed-code-leaves-scoring-alone"
kind = "gate"
type = "scoring"
note = """The work is scored with the tests and run configuration it started with, the hidden tests laid over them,
its own code run unprivileged in a container of its own. Behind that, its code (not its prose or comments) must not
be unmistakably aimed at the test runners or the scoring: vitest or Jest reporters, setup files or plugins added to
their configuration, writing the files the scorer reads, replacing `node_modules`. A repair that passes tests by
changing how they are run earns nothing."""

# ---------------------------------------------------------------- targets: the feature

[[criterion]]
id = "appview-feature-tests"
kind = "target"
type = "tests"
repository = "atproto"
set = "new"
note = """The share that pass of the tests the atproto project wrote for this feature in the AppView (252, all but three in `tests/notification-grouping.test.ts`), in
`packages/bsky/tests` (grouping, spotlights, related views, subscribed-reply parents, lighter hydration). Nobody on
the work can see them; the names they import are in the repository's INTERFACE.md, and the lexicon they call is
given."""

[[criterion]]
id = "app-feature-tests"
kind = "target"
type = "tests"
weight = 0.5
repository = "social-app"
set = "new"
note = """The share that pass of the tests the Bluesky project wrote for this feature in the app (210, in 13 files). They test
upstream's own query helpers (hydrating groups from their related views, group membership, moderation, follow
actors, unread state, paging), whose names are in INTERFACE.md but whose shape the brief does not settle, so they
weigh half. The screens themselves came without tests; they are judged by the browser target and the fit
criteria."""

[[criterion]]
id = "person-reads-grouped-notifications"
kind = "target"
type = "browser"
weight = 1
stages = ["network_starts", "app_builds", "app_shows_sign_in", "alice_signs_in", "notifications_open",
          "grouped_query_called", "likes_grouped_by_post", "likes_grouped_by_actor"]
note = """The business outcome. The dev network is started from `main` of atproto and an internal web build of the
app is made from `main` of social-app. Three accounts are made; two of them like Alice's newest post, and one of
those likes three more of her posts. Alice signs in to the app in a browser, through the PDS, and opens
Notifications. The app must ask the AppView for grouped notifications, and show one row naming both people for the
newest post, and one row for the three posts the one person liked. At the start this fails: the app lists
notifications and groups only likes of one post that land on the same page. If the check itself cannot run (no
browser, a port) it has no score; it does not fail."""

# ---------------------------------------------------------------- guards: what works today

[[criterion]]
id = "appview-existing-tests"
kind = "guard"
type = "tests"
repository = "atproto"
set = "preserved"
note = """The share that still pass of the AppView's tests that passed as the work started (1,198): the
whole of `packages/bsky/tests`, which runs in about five minutes with Postgres and Redis, after a build of about three."""

[[criterion]]
id = "app-existing-tests"
kind = "guard"
type = "tests"
repository = "social-app"
set = "preserved"
note = """The share that still pass of the app's tests that passed as the work started (1,468): its whole Jest
suite."""

# ---------------------------------------------------------------- fit: the two repositories against each other

[[criterion]]
id = "app-calls-only-served-methods"
kind = "fit"
type = "contract"
check = "valid_share"
note = """The share of the AppView methods the app's code calls (`.call(app.bsky....)`) that the AppView on `main`
serves (`server.add(...)` under `packages/bsky/src/api`), read from both sources. Methods that only the PDS or
another service answers (preferences, video, interactions) are left out, so this catches calls to methods that do
not exist."""

[[criterion]]
id = "app-copy-states-appview-lexicon"
kind = "fit"
type = "contract"
check = "copies_current"
note = """For each lexicon the feature adds or changes, whether the app's vendored copy (`lexicons/`, and its entry
in `lexicons.json`) states what the AppView on `main` has: the same definitions, compared without the formatting
and `$type` that `lex install` adds. An app built against an older or a hand-made copy of the lexicon does not fit
the AppView it runs against."""

[[criterion]]
id = "app-uses-what-appview-gained"
kind = "fit"
type = "contract"
check = "uses_new_api"
note = """The share the app calls of the methods the AppView gained that the real app calls
(`app.bsky.notification.getGroupedNotifications`). An app that never asks for groups does nothing with the
feature."""

# ---------------------------------------------------------------- measures

[[criterion]]
id = "pushed-code-review-signals"
kind = "measure"
type = "scoring"
signals = "review"
note = """Lines of the pushed code that mention the test runners or the scorer's files without being aimed at them in
an unmistakable way: for a reviewer to look at. They decide nothing, since honest code mentions such things too."""

[[criterion]]
id = "existing-tests-untouched"
kind = "measure"
type = "untouched"
note = """Most of the reward is decided by test suites that are the work's own to change. This lists every test file
and test setting of the work's start that was changed or removed (the hidden tests replace the ones the feature
had to change). A change here is not wrong in itself; it is what a reviewer should read first."""
