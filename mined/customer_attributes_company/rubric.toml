# The rubric of customer_attributes_company: every criterion the work is judged by, what decides it, and why it is there.
# tools/harbor_company_score.py (in a task: /tests/score.py) runs it. Format and reward: see that file's header.
#
# gate    = must pass for anything to be scored.
# target  = what the work is to achieve. Scores 0 on the company as the work starts.
# guard   = what must keep working. Scores 1 on the company as the work starts.
# fit     = whether the two repositories fit each other as they would be deployed.
# measure = reported beside the reward, never part of it.
# reward  = 0 if a gate fails, else weighted mean of targets x product of guards x product of fits.
#           Targets: the API's hidden tests (weight 1), the staff application's hidden tests (0.5: they are upstream's
#           unit tests, tied to how upstream built it), and staff setting a customer's tier in a browser (1).
#
# Every score is a share from 0 to 1, so work that is partly done is partly rewarded.

# ---------------------------------------------------------------- the gates

[[criterion]]
id = "api-runs-and-dashboard-calls-it"
kind = "gate"
type = "contract"
check = "works"
note = """The API as it is on `main` migrates a fresh database and answers, and the staff application's operations
could be found. Without this there is nothing the two sides could be held against each other with."""

[[criterion]]
id = "pushed-code-leaves-scoring-alone"
kind = "gate"
type = "scoring"
note = """The work is scored with the tests and run configuration it started with, the hidden tests laid over them,
its own code run unprivileged in a container of its own. Behind that, its code (not its prose or comments) must not
be unmistakably aimed at the test runners or the scoring: importing pytest's internals, defining pytest hooks or Jest
reporters, writing the files the scorer reads, adding interpreter start-up files. A repair that passes tests by
changing how they are run earns nothing."""

# ---------------------------------------------------------------- targets: the feature

[[criterion]]
id = "core-feature-tests"
kind = "target"
type = "tests"
repository = "core"
set = "new"
note = """The share that pass of the tests the Saleor project wrote for this feature in the API (203). Nobody on the
work can see them; the names they import are in the repository's INTERFACE.md."""

[[criterion]]
id = "dashboard-feature-tests"
kind = "target"
type = "tests"
weight = 0.5
repository = "dashboard"
set = "new"
exclude = '''^src/(components/ConditionalFilter/(API/(filterChoicesPage|initialState/customers/InitialCustomerState|initialState/product/useProductInitialAPIState)|FilterElement/Condition|UI/resolve(Async|Attribute)ComboboxState|ValueProvider/(TokenArray/(TokenArray|fetchingParams)|navigationQueryParams))|components/Sidebar/menu/(createCustomerTypeMenuItems|utils)|customerTypes/(handlers/customerTypeAttributeCreateHandler|utils/customerTypePageForm)|customers/(components/CustomerDetailsPage/saveComposition|utils/customerAttributes))\.test\.'''
note = """The share that pass of the tests the Saleor project wrote for this feature in the staff application, but
for those of upstream's own helper functions (105 of 184). What those helpers return is upstream's choice, which
neither the brief nor the interface settles, so they are reported as a measure below instead."""

[[criterion]]
id = "staff-set-a-customers-tier"
kind = "target"
type = "browser"
weight = 1
stages = ["core_migrates", "core_seeds", "core_serves", "dashboard_serves", "dashboard_shows_sign_in", "core_defines_tier", "dashboard_sets_tier", "core_keeps_tier"]
note = """The business outcome. The API and the staff application are started together from nothing, on the project's
sample data, and a "Contract tier" attribute (Bronze, Silver, Gold) is defined for customers through the API. A member
of staff signs in to the staff application in a browser, opens a customer's page, chooses Gold for "Contract tier" and
saves the page. Then the API, asked outside the staff application, must read the customer's tier as Gold and list
that customer, and no other, among customers whose tier is Gold. The browser finds the field by its name and the
nearest control to choose a value with, and saves with the page's save bar, as it is before the feature. If the check
itself cannot run (no browser, no database) it has no score; it does not fail."""

# ---------------------------------------------------------------- guards: what works today

[[criterion]]
id = "core-existing-tests"
kind = "guard"
type = "tests"
repository = "core"
set = "preserved"
note = """The share that still pass of the API's tests that passed as the work started (17,535)."""

[[criterion]]
id = "dashboard-existing-tests"
kind = "guard"
type = "tests"
repository = "dashboard"
set = "preserved"
note = """The share that still pass of the staff application's tests that passed as the work started (5,568)."""

# ---------------------------------------------------------------- fit: the two repositories against each other

[[criterion]]
id = "dashboard-asks-only-what-api-offers"
kind = "fit"
type = "contract"
check = "valid_share"
note = """The share of the GraphQL operations the staff application sends that are valid against the schema the API
on `main` really has. Each side's own tests pass against its own idea of the other; this is the two held together."""

[[criterion]]
id = "dashboard-uses-what-api-gained"
kind = "fit"
type = "contract"
check = "uses_new_api"
note = """The share the staff application uses of what the real staff application uses of what the API gained. A
staff application that sends only what was valid before fits the API and does nothing with the feature."""

[[criterion]]
id = "dashboard-schema-copies-current"
kind = "fit"
type = "contract"
check = "copies_current"
note = """The staff application keeps copies of the API's schema and generates its query code from them. The share of
what the API gained that those copies state, over all of them together: a copy left behind costs its share of this
criterion, not the whole reward."""

# ---------------------------------------------------------------- measures

[[criterion]]
id = "pushed-code-review-signals"
kind = "measure"
type = "scoring"
signals = "review"
note = """Lines of the pushed code that mention the test runners or the scorer's files without being aimed at them in
an unmistakable way: for a reviewer to look at. They decide nothing, since honest code mentions such things too."""

[[criterion]]
id = "staff-filter-customers-by-tier"
kind = "measure"
type = "browser"
stages = ["fresh_session_finds_customer"]
note = """After the above, a new staff session filters the customer list by "Contract tier" = Gold in the staff
application, and the list asks the API for exactly that customer (and for none of them under Silver). It goes through
the filter panel's own controls, which a staff application built differently may name otherwise, so it is reported
and not part of the reward."""

[[criterion]]
id = "dashboard-upstream-helper-tests"
kind = "measure"
type = "tests"
repository = "dashboard"
set = "new"
only = '''^src/(components/ConditionalFilter/(API/(filterChoicesPage|initialState/customers/InitialCustomerState|initialState/product/useProductInitialAPIState)|FilterElement/Condition|UI/resolve(Async|Attribute)ComboboxState|ValueProvider/(TokenArray/(TokenArray|fetchingParams)|navigationQueryParams))|components/Sidebar/menu/(createCustomerTypeMenuItems|utils)|customerTypes/(handlers/customerTypeAttributeCreateHandler|utils/customerTypePageForm)|customers/(components/CustomerDetailsPage/saveComposition|utils/customerAttributes))\.test\.'''
note = """The share that pass of the feature's tests of upstream's own helper functions in the staff application (79):
filter choice pages, combobox state, token arrays, menu builders, form and save helpers. A correct staff
application whose helpers are shaped otherwise fails them, so they are not part of the reward."""

[[criterion]]
id = "existing-tests-untouched"
kind = "measure"
type = "untouched"
note = """Most of the reward is decided by test suites that are the work's own to change. This lists every test file
and test setting of the work's start that was changed or removed (the hidden tests replace the ones the feature
had to change). A change here is not wrong in itself; it is what a reviewer should read first."""
