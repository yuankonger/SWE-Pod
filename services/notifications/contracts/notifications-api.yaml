# Notifications API. Owner: Notifications. The outbox stands in for the mail provider.
openapi: 3.0.3
info: {title: Notifications API, version: 2.0.0}
paths:
  /outbox:
    get:
      summary: Every email sent, oldest first. One email per event.
      parameters: [{name: customer_id, in: query, schema: {type: string}, description: 'Operations alerts are under the customer id "ops".'}]
  /dropped:
    get:
      summary: Events that could not be turned into an email, oldest first, each with the reason.
components:
  schemas:
    Email:
      type: object
      properties:
        event_id: {type: string}
        kind: {type: string, enum: [order_confirmation, shipping, cancellation, receipt, payment_failed, subscription_update, ops_alert]}
        customer_id: {type: string}
        to: {type: string}
        subject: {type: string}
        body: {type: string}
    Dropped:
      type: object
      properties: {event_id: {type: string}, event_type: {type: string}, reason: {type: string}}
