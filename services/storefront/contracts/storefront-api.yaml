# Storefront API. Owner: Storefront. The JSON routes are what the mobile app calls; the HTML routes are the shop.
openapi: 3.0.3
info: {title: Storefront API, version: 2.0.0}
paths:
  /checkout:
    post: {summary: 'JSON body as Orders PlaceOrder: places an order and returns an OrderPage (201). A form post is the shop''s checkout and redirects to the order page.'}
  /account/{customer_id}/orders:
    get: {summary: 'The customer''s orders as OrderPages, oldest first, each with its own invoice once Billing has issued one.'}
  /account/{customer_id}/subscriptions:
    get: {summary: The customer's subscriptions as SubscriptionPages.}
  /orders/{order_id}/cancel:
    post: {summary: Cancel an order. Returns the OrderPage.}
  /subscriptions/{subscription_id}/plan:
    post: {summary: 'Change plan. Body {sku}. Returns the SubscriptionPage.'}
  /subscriptions/{subscription_id}/cancel:
    post: {summary: End the subscription at the period end. Returns the SubscriptionPage.}
  /api/catalog:
    get: {summary: 'Products as {sku, name, unit_price_display, renews}.'}
  /api/cart/{customer_id}:
    get: {summary: The cart as a CartPage.}
  /api/cart/{customer_id}/items/{sku}:
    put: {summary: 'Set a quantity. Body {qty}; zero removes the item. Returns the CartPage.'}
  /:
    get: {summary: 'HTML: the shop. Sets the seedco_customer cookie on a first visit.'}
  /cart:
    get: {summary: 'HTML: the visitor''s cart.'}
  /cart/items:
    post: {summary: 'Form {sku, qty}: sets a quantity, then redirects to /cart.'}
  /orders/{order_id}:
    get: {summary: 'HTML: one of the visitor''s own orders. Another customer''s order is a 404.'}
  /account:
    get: {summary: 'HTML: the visitor''s orders (newest first) and subscriptions, with plan-change and cancel buttons.'}
components:
  schemas:
    OrderPage:
      type: object
      properties:
        order_id: {type: string}
        status: {type: string}
        status_label: {type: string, description: 'Order received, Paid, Payment failed, Shipped, Delivered or Cancelled'}
        lines: {type: array, items: {type: object, properties: {name: {type: string}, qty: {type: integer}, unit_price_display: {type: string}, line_total_display: {type: string}}}}
        subtotal_display: {type: string, example: '$56.23'}
        tax_display: {type: string}
        total_display: {type: string}
        invoice: {type: object, nullable: true, properties: {invoice_id: {type: string}, total_display: {type: string}, status: {type: string}}}
    CartPage:
      type: object
      properties:
        lines: {type: array, items: {type: object, properties: {sku: {type: string}, name: {type: string}, qty: {type: integer}, unit_price_display: {type: string}, line_total_display: {type: string}}}}
        subtotal_display: {type: string}
        empty: {type: boolean}
    SubscriptionPage:
      type: object
      properties:
        subscription_id: {type: string}
        plan: {type: string}
        qty: {type: integer}
        price_display: {type: string, example: '$49.98 a month'}
        status: {type: string}
        status_label: {type: string}
        note: {type: string, example: Renews on 2026-02-01}
        changes: {type: array, items: {type: object, properties: {sku: {type: string}, label: {type: string}}}}
        can_cancel: {type: boolean}
