# The company beside the agent's seat. Generated by tools/export_harbor_company.py.
{
  "services": {
    "git": {
      "build": {
        "context": "."
      },
      "command": [
        "python3",
        "/opt/seedco/gitserver_start.py"
      ],
      "environment": {
        "GIT_ACCESS": "{\"tokens\": {\"solo\": \"seat-7f3a91c2d4\", \"ci\": \"ci-2b8e6d10aa\", \"verifier\": \"verifier-c41f09be73\", \"oracle\": \"oracle-9a17c3e55b\", \"core\": \"seat-core-4e81b7\", \"dashboard\": \"seat-dashboard-4e81b7\"}, \"access\": {\"ci\": {\"core\": \"read\", \"dashboard\": \"read\"}, \"verifier\": {\"core\": \"read\", \"dashboard\": \"read\"}, \"oracle\": {\"core\": \"write\", \"dashboard\": \"write\"}, \"core\": {\"core\": \"write\", \"dashboard\": \"read\"}, \"dashboard\": {\"core\": \"read\", \"dashboard\": \"write\"}}}"
      },
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/ | grep -q 401"
        ],
        "interval": "3s",
        "timeout": "5s",
        "retries": 40
      },
      "image": "seedco-task-customer-attributes-company:1"
    },
    "ci": {
      "command": [
        "python3",
        "/opt/seedco/ci.py"
      ],
      "volumes": [
        "deployed:/deployed"
      ],
      "environment": {
        "CI": "{\"git\": \"http://ci:ci-2b8e6d10aa@git:8080\", \"repositories\": [\"core\", \"dashboard\"], \"contract\": {\"provider\": \"core\", \"consumer\": \"dashboard\", \"url\": \"http://core:8000/graphql/\", \"staff\": [\"admin@example.com\", \"admin\"]}}"
      },
      "depends_on": {
        "git": {
          "condition": "service_healthy"
        }
      },
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "curl -sf http://127.0.0.1:8080/ready > /dev/null"
        ],
        "interval": "10s",
        "timeout": "8s",
        "retries": 90,
        "start_period": "600s"
      },
      "image": "seedco-task-customer-attributes-company:1",
      "pull_policy": "never"
    },
    "judge": {
      "command": [
        "python3",
        "/opt/seedco/judge.py"
      ],
      "volumes": [
        "${HOST_VERIFIER_LOGS_PATH}/../judge:/judge-out"
      ],
      "environment": {
        "JUDGE": "{\"token\": \"judge-3b9e51c07a2d\", \"git\": \"http://verifier:verifier-c41f09be73@git:8080\", \"repositories\": [\"core\", \"dashboard\"], \"user\": \"scorer\"}"
      },
      "depends_on": {
        "git": {
          "condition": "service_healthy"
        }
      },
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "curl -sf http://127.0.0.1:8095/ready > /dev/null"
        ],
        "interval": "5s",
        "timeout": "5s",
        "retries": 120
      },
      "image": "seedco-task-customer-attributes-company:1",
      "pull_policy": "never"
    },
    "meter": {
      "command": [
        "python3",
        "/opt/seedco/model_meter.py",
        "${METER_UPSTREAM:-https://api.anthropic.com}",
        "/srv/meter",
        "8318"
      ],
      "image": "seedco-task-customer-attributes-company:1",
      "pull_policy": "never",
      "depends_on": {
        "git": {
          "condition": "service_started"
        }
      }
    },
    "core": {
      "command": [
        "python3",
        "/opt/seedco/service.py",
        "core"
      ],
      "volumes": [
        "deployed:/deployed"
      ],
      "environment": {
        "CI": "true",
        "pnpm_config_verify_deps_before_run": "false",
        "NODE_PATH": "/deps/node_modules",
        "ALLOWED_HOSTS": "*",
        "SERVICE": "{\"start\": \"python manage.py runserver 0.0.0.0:8000 --noreload\", \"prepare\": \"python manage.py migrate\", \"first\": \"python manage.py populatedb --createsuperuser\"}"
      },
      "image": "seedco-task-customer-attributes-company:1",
      "pull_policy": "never",
      "depends_on": {
        "git": {
          "condition": "service_started"
        }
      }
    },
    "dashboard": {
      "command": [
        "python3",
        "/opt/seedco/service.py",
        "dashboard"
      ],
      "volumes": [
        "deployed:/deployed"
      ],
      "environment": {
        "CI": "true",
        "pnpm_config_verify_deps_before_run": "false",
        "NODE_PATH": "/deps/node_modules",
        "ALLOWED_HOSTS": "*",
        "SERVICE": "{\"start\": \"pnpm run dev\"}",
