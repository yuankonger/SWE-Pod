schema_version = "1.4"

[task]
name = "seedco/task03-payment-incidents"
description = "Three reports after release 2026.11: refunds paid too often, a subscriber billed three times, renewals held up"
keywords = ["swe-pod", "multi-service", "diagnosis"]

[metadata]
category = "software-engineering"
