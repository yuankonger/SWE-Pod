repeats = 3

# ---------------------------------------------------------------- the gates

[[criterion]]
id = "live-shop-runs-main"
kind = "gate"
type = "deploy"
note = """What is judged is the running company, so first it is settled what is running: `main` of each repository,
what CI last deployed and what each system says of itself are the same commits, the deploy is over and every
system is up. Otherwise the orders below would be placed on something nobody can name."""

[[criterion]]
id = "records-kept"
kind = "gate"
type = "history"
note = """Every order the shop had before the work, and every order placed through the provider during it, is read
again. An order's figures may have been put right, and a confirmation recorded twice may now be recorded once. But
the order and its payment are still there, and nothing the provider took or gave back has gone from the books:
charged + refunded + pending is at least what it took, refunded + pending at least what it returned. Orders that never went
through the provider are as they were. Passes on the company as the work starts; fails where records were deleted
or zeroed to make the figures agree. A gate: a repair that loses records earns nothing, whatever else it puts right."""

# ---------------------------------------------------------------- targets: the problem

[[criterion]]
id = "one-refund-confirmed-twice"
kind = "target"
type = "scenario"
charge = "all"
refunds = [0.5]
note = """An order is charged in full and half is refunded; the provider confirms the refund late and sends the
confirmation twice. The API reports that half refunded, once, the rest charged, and nothing pending."""

[[criterion]]
id = "two-refunds-of-one-order"
kind = "target"
type = "scenario"
charge = "all"
refunds = [0.3, 0.3]
note = """An order is refunded twice, 30% each time. Both refunds are counted, each once, and neither is left pending.
A fix that counts one refund per payment passes the criterion above and fails this one."""

