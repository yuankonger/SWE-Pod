schema_version = "1.4"

[task]
name = "seedco/customer-attributes-company"
description = "Customer attributes across Saleor's API and its dashboard (August 2026)"
keywords = ["swe-pod", "multi-repository", "mined", "interface agreement"]

[metadata]
category = "software-engineering"
repositories = 2
