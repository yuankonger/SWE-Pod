[[criterion]]
id = "owner-switches-off-power-strip"
kind = "target"
type = "browser"
weight = 1
stages = ["frontend_builds", "core_serves", "frontend_shows_sign_in", "owner_signs_in", "devices_listed", "outlet_page_opens",
          "owner_disables_strip", "outlets_follow_strip", "owner_enables_strip", "outlets_come_back"]
note = """The business outcome. The frontend's production build is made from `main`, and Home Assistant from `main`
of core is started with it from a fresh configuration with the demo integration, whose power strip has two outlets.
The owner signs in in a browser, finds the strip and its outlets among the devices, opens an outlet's page, and turns
the strip off in its settings. Then, asked outside the browser over the WebSocket API, the strip must read as
disabled by the user and both outlets as disabled because of their device; turned on again, all three must read as
enabled. The browser uses the controls the frontend had before the feature (the device page's "Edit settings", the
"Enable device" switch, "Update"). At the start this fails: the outlets are devices of their own and stay on. With
core done and the frontend not, the devices page lists nothing. If the check itself cannot run (no browser, a port)
it has no score; it does not fail."""

[[criterion]]
id = "owner-sees-strip-and-outlets"
kind = "target"
type = "browser"
weight = 0.5
stages = ["frontend_builds", "core_serves", "frontend_shows_sign_in", "owner_signs_in", "devices_listed", "outlet_page_opens",
          "strip_page_lists_outlets", "outlet_page_links_strip", "integration_nests_outlets"]
note = """What the frontend shows of the parts, in the same browser session as owner-switches-off-power-strip, before
the strip is touched: the strip's device page links to each outlet's device page, each outlet's page links to the
strip's, and on the demo integration's page the outlets are listed after the strip, with none of the integration's
other devices between, and indented from it (their names start further in than the strip's, as drawn). A link is
anything with the device page's address as its `href`, however it is presented. Upstream's change to the screens came
without tests, so this is what holds the brief's third and fourth frontend points; the frontend's own feature tests
hold the first two. With core done, a frontend that resolves children but shows nothing new fails all three (the
outlets no longer reach the strip through `via_device_id`, which drew such links before). It weighs half: the screens
are judged by what is drawn, not by how it is built."""

