# ---------------------------------------------------------------- the gates

[[criterion]]
id = "core-runs-and-frontend-calls-it"
kind = "gate"
type = "contract"
check = "works"
note = """Home Assistant as it is on `main` of core starts from a fresh configuration, is onboarded and answers over its
WebSocket API, and the frontend's commands could be found. Without this there is nothing the two sides could be held
against each other with."""

[[criterion]]
id = "pushed-code-leaves-scoring-alone"
kind = "gate"
type = "scoring"
note = """The work is scored with the tests and run configuration it started with, the hidden tests laid over them,
its own code run unprivileged in a container of its own. Behind that, its code (not its prose or comments) must not
be unmistakably aimed at the test runners or the scoring: importing pytest's internals, defining pytest hooks or
vitest reporters, writing the files the scorer reads, adding interpreter start-up files. A repair that passes tests by
changing how they are run earns nothing."""

