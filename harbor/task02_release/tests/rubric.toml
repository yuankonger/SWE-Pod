[[criterion]]
id = "ops7-no-fulfil-before-confirm"
ticket = "OPS-7"
kind = "feature"
type = "test"
test = "test_core_api__an_unconfirmed_order_cannot_be_fulfilled_but_can_be_cancelled"
note = """What "held" means for staff: fulfilling an unconfirmed order is refused with CANNOT_FULFILL, it works
