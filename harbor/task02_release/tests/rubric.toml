[[criterion]]
id = "ops7-mobile-shows-received"
ticket = "OPS-7"
kind = "feature"
type = "test"
test = "test_core_mobile__a_held_order_shows_as_received_in_every_supported_build"
note = """The same for every supported build of the mobile app, including the released one that cannot be
changed: it buys, and shows the held order as "Order received"."""

